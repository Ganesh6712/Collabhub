services:
  postgres:
    image: postgres:16-alpine
    container_name: collabhub-postgres
    environment:
      POSTGRES_USER: collabhub
      POSTGRES_PASSWORD: collabhub_secret
      POSTGRES_DB: collabhub
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U collabhub -d collabhub"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: collabhub-redis
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: collabhub-api
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://collabhub:collabhub_secret@postgres:5432/collabhub?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      SMTP_HOST: ${SMTP_HOST:-smtp.ethereal.email}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      FROM_EMAIL: ${FROM_EMAIL:-CollabHub <noreply@collabhub.com>}
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "npx prisma migrate deploy && node dist/index.js"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: collabhub-web
    environment:
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      # Browser reaches the API via your PC's localhost
      NEXT_PUBLIC_API_URL: http://localhost:4000
      # NextAuth runs server-side INSIDE the container -> use the
      # Docker network name, not localhost
      API_URL: http://api:4000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
